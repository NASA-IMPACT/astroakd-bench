[project]
name = "astroakd-bench"
version = "0.6.7.10"
description = "Reproducible MCP-native benchmarks for astronomical archive-discovery agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0,<4"]

[project.optional-dependencies]
openai = ["openai>=1.80.0"]
plots = ["matplotlib>=3.8"]
docs = ["sphinx>=8.2,<10", "myst-parser>=4,<6", "sphinx-rtd-theme>=3.1,<4"]

[tool.uv]
package = false
